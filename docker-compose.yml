services:
  postgres:
    image: postgres:16-alpine
    container_name: cocktail_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: s1iwa
      POSTGRES_PASSWORD: lubieplacki
      POSTGRES_DB: cocktail_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: